name: ci

# runtime の依存は無い (ページの中で評価されるのは書いたままの TS のバイト列)。dev の依存は
# typescript だけで、それが型の門番の 1 か所目 —— **型が通らない TS は tag にならない**。
# 2 か所目は ts-compile-service (クロールの段ごとに同じ型検査をしてから JS にする)。
#
# 見ているのは 2 つ: tsc (型と構文) と tools/check.mjs (catalog.json と実体の一致 / sha256 の
# 印字)。**振る舞いはここでは見ない** —— jsdom はレイアウトを持たないので autoscroll は
# 1 段も進まない。証拠は capture-scheduler の e2e (本物のブラウザ) に置いてある。

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=low

      - name: Check
        run: pnpm run check
